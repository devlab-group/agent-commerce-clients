# Development uv workspace: one environment for all three packages
[tool.uv.workspace]
members = [
    "agent-commerce-client",
    "langchain-agent-commerce",
    "agent-framework-agent-commerce",
]

[tool.uv.sources]
agent-commerce-client = { workspace = true }
langchain-agent-commerce = { workspace = true }
agent-framework-agent-commerce = { workspace = true }

[dependency-groups]
dev = [
    "langchain-tests>=1.1.9,<2",
    "pytest>=9",
    "pytest-asyncio>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["e2e"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: runs against a live gateway and chain; needs ACG_E2E=1"]

[tool.ruff]
line-length = 120
target-version = "py310"
