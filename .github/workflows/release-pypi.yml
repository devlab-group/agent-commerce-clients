# Publish one Python package to PyPI when its release tag is pushed, for example
# py/langchain-agent-commerce/v0.1.1. The tag version must match pyproject.toml.
# Configure a PyPI trusted publisher for release-pypi.yml and the pypi environment
# to publish without a stored API token.
# Push release tags one at a time: GitHub creates no tag events when more than
# three tags are pushed together.
name: release-pypi

on:
  push:
    tags:
      - 'py/*/v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: python
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Check the tag against the package version
        run: |
          package=${TAG#py/}
          package=${package%/v*}
          version=$(uv version --package "$package" --short)
          if [ "$TAG" != "py/$package/v$version" ]; then
            echo "::error::Tag $TAG does not match $package $version in pyproject.toml"
            exit 1
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - run: uv sync --all-packages --locked -p 3.12
      - run: uv run -p 3.12 pytest "$PACKAGE"
      - run: uv build --package "$PACKAGE" --no-sources --out-dir dist
      - run: uv publish --trusted-publishing always dist/*
