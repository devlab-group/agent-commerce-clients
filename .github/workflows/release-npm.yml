# Publish one npm package when its release tag is pushed, for example
# typescript/agent-commerce-ai-sdk/v0.1.1. The tag version must match package.json.
# Configure an npm trusted publisher for release-npm.yml and the npm environment
# to publish without a stored token. For public packages in public repositories,
# npm adds provenance automatically.
# Push release tags one at a time: GitHub skips tag events when more than
# three tags are pushed together.
name: release-npm

on:
  push:
    tags:
      - 'typescript/*/v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: typescript
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing requires npm 11.5.1+, available in Node 24 since 24.7.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check the tag against the package version
        run: |
          package=${TAG#typescript/}
          package=${package%/v*}
          version=$(jq -r .version "$package/package.json")
          if [ "$TAG" != "typescript/$package/v$version" ]; then
            echo "::error::Tag $TAG does not match $package $version in package.json"
            exit 1
          fi
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm publish -w "$PACKAGE"
